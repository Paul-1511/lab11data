# =============================================================================
# Configuración del pipeline — Laboratorio 11 (MLOps) · CC3066 Data Science
# Todo lo que cambia entre ejecuciones vive aquí: rutas, períodos, parámetros
# y umbrales de aceptación. Los comentarios "CONFIRMAR" marcan decisiones
# del grupo que aún no están cerradas.
# =============================================================================

run:
  seed: 42                         # semilla para cualquier componente aleatorio
  output_dir: artifacts/runs       # una carpeta por ejecución (run_id)
  published_dir: published         # versiones aprobadas que lee el tablero

target:
  name: ingreso_mensual_visitantes_no_residentes
  destination: Guatemala           # CONFIRMAR: destino asignado al grupo
  unit: visitantes por mes
  granularity: monthly             # la variable se estima por mes
  breakdowns: [via, region, residencia]   # niveles adicionales de agregación

source:
  # Los datos institucionales NO van en la imagen Docker ni se versionan en Git:
  # se montan o se indica la ruta aquí (o con --data en la línea de comandos).
  # Es el mismo archivo del Laboratorio 2 (hoja "Datos"; la hoja "Notas" documenta la fuente).
  path: data/raw/Base_Migracion_2009-2026jun.xlsx
  sheet: Datos                     # solo aplica a Excel
  granularity: monthly             # la fuente es mensual (no presencias diarias)

columns:
  # Nombres tal como aparecen en la hoja "Datos" del Excel.
  value: Viajero
  date:
    mode: year_month               # year_month | column
    year: Año
    month: Mes cod                 # numérico 1-12 (la columna "Mes" trae el nombre abreviado)
    column: Fecha                  # solo si mode: column
  dimensions:
    via: Vía
    region: Región dos
    residencia: Agrupación Residencia
  required:                        # si falta o tiene tipo incompatible: se detiene
    Viajero: numeric
    Año: numeric
    Mes cod: month
    Tipo de Viajero: text
    Frontera: text
    País: text
  optional:                        # si falta: advertencia
    Vía: text
    Región dos: text
    Agrupación Residencia: text
  missing_sentinels: ["0", "", "nan", "NaN", "N/D", "-"]   # equivalen a "sin dato" en dimensiones ("Región dos" trae "0" en 13 filas)

# Población de referencia: según la hoja "Notas" de la fuente, para analizar visitantes se
# usa Turista + Excursionista. "Viajero" (cruce fronterizo sin ser visitante) NO es visitante y
# "Cruceristas" solo existe hasta 2022 (desde 2023 los cruceros se miden por fuente portuaria externa).
filters:
  - {column: "Tipo de Viajero", values: ["Turista", "Excursionista"]}

periods:
  expected_start: "2009-01"        # primer mes que debería existir en la fuente
  expected_end: "2026-06"          # último mes esperado (cobertura configurada)
  # PROPUESTA (CONFIRMAR): la fuente cambia de metodología entre 2022 y 2023 (hoja "Notas"),
  # así que el ajuste y la evaluación usan solo el tramo homogéneo 2023-01 en adelante.
  fit:  {start: "2023-01", end: "2024-12"}   # ventana inicial de ajuste (se expande mes a mes)
  eval: {start: "2025-01", end: "2025-12"}   # evaluación con origen móvil: cada mes se estima con datos previos
  forecast: {start: "2026-07", end: "2026-12"} # horizonte que se entrega como candidato; no tiene observaciones comparables

parameters:
  estimator: seasonal_naive        # candidato: valor del mismo mes del año anterior
  seasonal_period: 12              # meses; preserva la estacionalidad sin reentrenar un modelo
  baseline: last_observed          # referencia: last_observed | historical_mean
  allocation_factor: null          # no aplica al total mensual; reservar si se estima un desglose en el futuro

acceptance:
  # Regla fija: calidad sin FAIL, salidas completas, ≥6 meses comparables y
  # MAE candidato no mayor que 10 % sobre la referencia. No se ajusta por ejecución.
  min_evaluated_months: 6
  max_mae_ratio_to_baseline: 1.10

quality:
  columns:
    max_unparseable_frac: 0.0      # tipo incompatible: fracción tolerada de valores no convertibles
  dates:
    max_invalid_frac: 0.001        # >0 advierte; por encima de este umbral detiene
  coverage:
    required_ranges: [fit, eval]   # meses sin datos aquí detienen el flujo
    allowed_missing_months: []     # huecos conocidos y documentados, p. ej. ["2026-01", "2026-02"]
  uniqueness:
    # Granularidad real de la fuente: mes × vía × frontera × país × agrupación de residencia × tipo de viajero.
    # Sin "Agrupación Residencia" aparecen 42 falsos duplicados (un mismo país reparte su conteo en dos agrupaciones).
    key: [__fecha__, Vía, Frontera, País, Agrupación Residencia, Tipo de Viajero]
    max_duplicate_frac: 0.0        # cualquier duplicado detiene
  missing:
    blocking: [Viajero]            # faltante aquí impide estimar
    max_blocking_frac: 0.0
    allowed: [Vía, Región dos, Agrupación Residencia]   # se etiquetan "Sin dato"
    max_allowed_frac: 0.05         # >0 advierte; por encima detiene
  values:
    zero_total: fail               # fail | warn — total mensual = 0 (denominador del reparto)
  methodology:
    reconciliation_rel_tol: 1.0e-9 # la serie mensual debe cuadrar con la suma de la fuente mensual
